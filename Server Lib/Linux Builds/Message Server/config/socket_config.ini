// ---------- ip rules ---------

// enable ip rules: 1 ON, 0 OFF
enable_ip_rules: 1

// Connection limit per IP, I will leave it at 10
limit_connection_per_ip: 10

// Order in which the IP rules are checked
// deny,allow
// allow, deny
// mutual-failure

order: deny,allow

// ip rules
// allow accepts
// deny rejects

allow: 127.0.0.1
// allow: 192.168.0.0/16
// allow: 10.0.0.0/255.0.0.0
// allow: all

// deny: 127.0.0.1/8
// deny: 127.0.0.1

// ---------- DDoS Protection ---------

// if ddos_count connection requests fall within the DDoS attack interval (msec),
// it is assumed to be a DDoS attack

// DDoS attack interval in milliseconds
// 3000 = 3 seconds
ddos_interval: 3000

// number of connection attempts that count as a DDoS attack
ddos_count: 5


// time before resetting an IP that was flagged for a DDoS attack
// 600000 = 10 minutes
ddos_autoreset: 600000